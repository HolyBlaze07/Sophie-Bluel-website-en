<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Sophie Bluel <span>Interior Designer</span></h1>
    <nav>
      <ul>
        <li><a href="#portfolio">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="./login.html">Login</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <!-- Portfolio Section -->
    <section id="portfolio">
      <h2>My Projects</h2>
      <div class="category-menu"></div>
      <div class="gallery"></div>
      <button id="edit-btn">Edit</button>
    </section>

    <!-- Modal -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="photo-gallery" class="modal-view">
          <h2>Photo Gallery</h2>
          <button id="to-add-photo">Add a photo</button>
        </div>
        <div id="add-photo" class="modal-view hidden">
          <h2>Add Photo</h2>
          <form id="add-photo-form">
            <input type="file" id="file-upload" accept="image/*" required />
            <input type="text" id="title" placeholder="Title" required />
            <button type="submit">Upload</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <p>Legal Notice</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
